name: Java Build
on:
  push:
    branches:
      - trunk
    tags:
      - v*
  pull_request:

permissions:
  contents: write

env:
  # Paper 26.2 is built for Java 25.
  JDK_VERSION: '25'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven

      # Mammoth compiles against paper-api only, so there is no BuildTools step here any more.
      - name: Build with Maven
        run: mvn -B --no-transfer-progress package --file pom.xml

      - name: Resolve .jar name
        id: prep
        run: |
          JAR_PATH=$(echo target/Mammoth*.jar)
          echo "jar_path=${JAR_PATH}" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "${JAR_PATH}")" >> "$GITHUB_OUTPUT"

      - name: Upload .jar
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.jar_name }}
          path: ${{ steps.prep.outputs.jar_path }}

      - name: Create Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: Mammoth ${{ github.ref_name }}
          files: ${{ steps.prep.outputs.jar_path }}
